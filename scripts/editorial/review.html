<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; base-uri 'none'; form-action 'none'">
<title>Guide evidence review</title>
<style>
:root{font:16px/1.5 system-ui,sans-serif;color:#163b33;background:#f5f7f2}body{max-width:1100px;margin:auto;padding:1.5rem}h1,h2{line-height:1.2}header,.tools,.guide,.item{background:white;border:1px solid #d4e2da;border-radius:12px;padding:1rem;margin:.8rem 0}label{display:block;font-weight:600;margin:.6rem 0}input,select,textarea,button{font:inherit;padding:.55rem;border:1px solid #829d90;border-radius:6px}input[type=search],textarea{width:min(100%,40rem);box-sizing:border-box}button{background:#185c47;color:white;cursor:pointer;margin:.3rem .5rem .3rem 0}a{color:#135b9b;overflow-wrap:anywhere}.muted{color:#4a645a}.item{border-left:4px solid #d2a34d}.row{display:flex;gap:1rem;flex-wrap:wrap}.chip{font-size:.8rem;color:#5b4b23;background:#f7edce;padding:.2rem .5rem;border-radius:5px}summary{cursor:pointer;font-weight:700}pre{white-space:pre-wrap;overflow-wrap:anywhere}#status{min-height:1.5em;color:#7a3d12}textarea{min-height:4rem}.small{font-size:.9rem}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #2694cf}
</style></head><body><header><p class="muted">OFFLINE · EDITORIAL PROPOSALS ONLY</p><h1>Guide evidence review</h1><p>All real facts start undecided. Decisions are saved only in this browser and exported files. A proposal does not publish a profile. Evidence links open separately.</p></header>
<section class="tools" aria-label="Review controls"><label>Editor label <input id="editor" type="text" maxlength="200" placeholder="Enter your name or review label"></label><label>Search name, business, or registration <input id="search" type="search" placeholder="Search records"></label><label>Show <select id="filter" aria-label="Show"><option value="all">All items</option><option value="candidates">Candidate fields</option><option value="attribute">Attributes</option><option value="waterway">Waterways</option><option value="relationship">Relationships</option><option value="hold">Holds</option><option value="conflict">Conflicts</option><option value="unsupported">Unsupported fields</option></select></label><div><button id="export" type="button">Export decisions</button><label>Import decisions <input id="import" type="file" accept="application/json,.json"></label></div><p id="status" role="status" aria-live="polite"></p><p id="count" class="muted"></p></section><main id="results"></main>
<script>
'use strict';
const MODEL=/*__REVIEW_DATA__*/;
const byId=new Map(MODEL.items.map(x=>[x.item_id,x]));const guides=new Map(MODEL.guides.map(x=>[x.guide_id,x]));
const storageKey='ratemyguide-editorial-v1-'+MODEL.model_sha256;let saved={editor:'',decisions:{}};let durable=false,storageBlocked=false;
try{const raw=localStorage.getItem(storageKey);if(raw){const parsed=JSON.parse(raw);if(!parsed||typeof parsed!=='object'||!parsed.decisions)throw Error('Invalid saved work');saved=parsed}durable=true}catch{storageBlocked=true}
const editor=document.getElementById('editor'),search=document.getElementById('search'),filter=document.getElementById('filter'),results=document.getElementById('results'),status=document.getElementById('status');editor.value=saved.editor||'';
if(storageBlocked)status.textContent='Saved browser work could not be read; import a backup before continuing. Browser storage will not be overwritten.';
function persist(){saved.editor=editor.value;if(storageBlocked){durable=false;return}try{localStorage.setItem(storageKey,JSON.stringify(saved));durable=true}catch{durable=false;status.textContent='Browser storage unavailable. Export your decisions before closing.'}}
window.addEventListener('beforeunload',e=>{if(!durable&&Object.keys(saved.decisions).length){e.preventDefault();e.returnValue=''}});
editor.addEventListener('input',persist);search.addEventListener('input',render);filter.addEventListener('change',render);
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=String(text);if(cls)n.className=cls;return n}
function sourceLink(parent,src){if(!src)return;const p=node('p',undefined,'small');let u;try{u=new URL(src.url);if(u.protocol!=='https:'||u.username||u.password)throw Error()}catch{p.textContent='Unsafe or unavailable source link';parent.append(p);return}const a=node('a',src.url);a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';p.append(a,document.createTextNode(' · '+(src.locator||'No locator')+' · Reviewed '+(src.reviewed_on||'not recorded')+' · '+(src.source_type||'')+' / '+(src.retrieval_method||src.method||'')));parent.append(p)}
function setDecision(item,patch){const old=saved.decisions[item.item_id]||{item_id:item.item_id,guide_id:item.guide_id,action:'',reason:'',evidence_id:item.source_id||''};saved.decisions[item.item_id]={...old,...patch};if(!saved.decisions[item.item_id].action)delete saved.decisions[item.item_id];persist()}
function itemView(item){const r=item.record,box=node('article',undefined,'item');const label=item.category==='relationship'?'Explicit relationship':item.category==='attribute'?(r.kind||'attribute'):item.category;box.append(node('span',label,'chip'));
 if(r.value!==undefined)box.append(node('p',typeof r.value==='object'?JSON.stringify(r.value):r.value));
 if(r.relationship)box.append(node('p','Source-stated relationship: '+JSON.stringify(r.relationship)));
 if(r.reason)box.append(node('p','Hold: '+r.reason));if(item.next_evidence_needed)box.append(node('p','Needed: '+item.next_evidence_needed));if(r.details)box.append(node('pre',JSON.stringify(r.details,null,2)));
 if(r.evidence_scope)box.append(node('p','Evidence scope: '+r.evidence_scope,'small'));
 if(r.identity_evidence?.assessment)box.append(node('p','Identity: '+r.identity_evidence.assessment,'small'));
 for(const text of r.limitations||[])box.append(node('p','Limit: '+text,'small'));
 if(item.origin==='followup')box.append(node('p','Additive follow-up; original hold remains in force.','small'));
 if(item.source_id)sourceLink(box,MODEL.sources[item.source_id]);
 for(const sid of item.evidence_options||[])sourceLink(box,MODEL.sources[sid]);
 const old=saved.decisions[item.item_id]||{};const lbl=node('label','Proposed decision '),sel=node('select');sel.setAttribute('aria-label','Decision for '+item.category+' '+(typeof r.value==='string'?r.value:item.guide_id));
 const choices=item.category==='hold'||item.category==='conflict'?[['','Undecided'],['resolve','Propose resolution'],['reject','Reject'],['hold','Keep on hold']]:item.category==='unsupported'?[['','Undecided'],['reject','Reject'],['hold','Keep on hold']]:[['','Undecided'],['approve','Propose approval'],['reject','Reject'],['hold','Keep on hold']];
 for(const [v,t] of choices){const o=node('option',t);o.value=v;sel.append(o)}sel.value=old.action||'';lbl.append(sel);box.append(lbl);
 const reasonLabel=node('label','Reason '),reason=node('textarea');reason.maxLength=2000;reason.value=old.reason||'';reason.disabled=!sel.value;reason.setAttribute('aria-label','Reason for '+item.category+' '+(typeof r.value==='string'?r.value:item.guide_id));reasonLabel.append(reason);box.append(reasonLabel);
 let ev;if(item.evidence_options){const evLabel=node('label','Evidence supporting this decision ');ev=node('select');ev.setAttribute('aria-label','Evidence for '+item.category+' '+item.guide_id);const blank=node('option','Choose evidence');blank.value='';ev.append(blank);for(const sid of item.evidence_options){const src=MODEL.sources[sid];const option=node('option',(src?.url||'source')+' · '+(src?.locator||''));option.value=sid;ev.append(option)}ev.value=old.evidence_id||'';ev.disabled=!sel.value;evLabel.append(ev);box.append(evLabel)}
 sel.addEventListener('change',()=>{reason.disabled=!sel.value;if(ev)ev.disabled=!sel.value;setDecision(item,{action:sel.value,reason:reason.value,evidence_id:ev?.value||item.source_id||''})});
 reason.addEventListener('input',()=>setDecision(item,{reason:reason.value}));if(ev)ev.addEventListener('change',()=>setDecision(item,{evidence_id:ev.value}));return box}
function render(){results.replaceChildren();const q=search.value.trim().toLowerCase(),cat=filter.value;let count=0;
 for(const g of MODEL.guides){const info=g.registry_identity;const hay=[g.guide_id,info.name,info.business,info.website].join(' ').toLowerCase();if(q&&!hay.includes(q))continue;
 const found=MODEL.items.filter(x=>x.guide_id===g.guide_id&&(cat==='all'||x.category===cat||(cat==='candidates'&&['attribute','waterway','relationship'].includes(x.category))));if(!found.length)continue;count++;
 const group=node('details',undefined,'guide');group.append(node('summary',g.guide_id+' · '+info.name+' · '+(info.business||'No business listed')));
 group.append(node('p','Registry name: '+info.name+' | Business: '+JSON.stringify(info.business)+' | Website: '+(info.website||'not listed')));
 group.append(node('p','Proposed display fields are shown below as individual name or business items; registry fields above stay unchanged.'));
 group.append(node('p','Disposition: '+g.disposition+' · '+g.review_status,'muted'));if(g.identity_evidence?.assessment)group.append(node('p','Identity assessment: '+g.identity_evidence.assessment));
 for(const t of g.limitations||[])group.append(node('p','Limit: '+t,'small'));
 const follow=MODEL.followup[g.guide_id];if(follow){group.append(node('p','Additive evidence: '+follow.record.finding));group.append(node('p','Decision/evidence needed: '+follow.record.next_evidence_needed));for(const source of Object.values(follow.sources))sourceLink(group,source)}
 for(const item of found)group.append(itemView(item));results.append(group)}document.getElementById('count').textContent=count+' matching guide records';}
// JSON.parse silently accepts duplicate object keys. This parser rejects them.
function strictJson(s){let p=0;function ws(){while(/\s/.test(s[p]||'')&&p<s.length)p++}function str(){const start=p++;while(p<s.length){if(s[p]==='\\'){p+=2;continue}if(s[p++]==='"')return JSON.parse(s.slice(start,p))}throw Error('Unterminated string')}
 function val(){ws();const c=s[p];if(c==='"')return str();if(c==='{'){p++;ws();const out=Object.create(null),seen=new Set();if(s[p]==='}'){p++;return out}while(true){ws();if(s[p]!=='"')throw Error('Invalid object');const k=str();if(seen.has(k))throw Error('Duplicate JSON key: '+k);seen.add(k);ws();if(s[p++]!==':')throw Error('Missing colon');out[k]=val();ws();const sep=s[p++];if(sep==='}')return out;if(sep!==',')throw Error('Invalid object separator')}}if(c==='['){p++;ws();const out=[];if(s[p]===']'){p++;return out}while(true){out.push(val());ws();const sep=s[p++];if(sep===']')return out;if(sep!==',')throw Error('Invalid array separator')}}const match=s.slice(p).match(/^(?:true|false|null|-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?)/);if(!match)throw Error('Invalid JSON');p+=match[0].length;return JSON.parse(match[0])}const out=val();ws();if(p!==s.length)throw Error('Trailing JSON');return out}
function header(){return {schema_version:1,baseline_sha256:MODEL.baseline_sha256,candidate_sha256:MODEL.candidate_sha256,followup_sha256:MODEL.followup_sha256,model_sha256:MODEL.model_sha256,editor:editor.value,decisions:[]}}
function validateDoc(doc){const keys=['schema_version','baseline_sha256','candidate_sha256','followup_sha256','model_sha256','editor','decisions'];if(!doc||typeof doc!=='object'||Array.isArray(doc)||Object.keys(doc).sort().join('|')!==[...keys].sort().join('|'))throw Error('Invalid decision file fields');const expected=header();for(const k of ['schema_version','baseline_sha256','candidate_sha256','followup_sha256','model_sha256'])if(doc[k]!==expected[k])throw Error('Stale or mismatched '+k);if(typeof doc.editor!=='string'||doc.editor.length>200||!Array.isArray(doc.decisions))throw Error('Invalid editor or decisions');if(doc.decisions.length&&!doc.editor.trim())throw Error('Enter an editor label');const seen=new Set();for(const d of doc.decisions){if(!d||Object.keys(d).sort().join('|')!=='action|evidence_id|guide_id|item_id|reason')throw Error('Invalid decision fields');const item=byId.get(d.item_id);if(!item||d.guide_id!==item.guide_id||seen.has(d.item_id))throw Error('Unknown, changed, or duplicate decision');seen.add(d.item_id);const allowed=item.category==='hold'||item.category==='conflict'?['resolve','reject','hold']:item.category==='unsupported'?['reject','hold']:['approve','reject','hold'];if(!allowed.includes(d.action)||typeof d.reason!=='string'||!d.reason.trim()||d.reason.length>2000)throw Error('Decision needs a valid action and reason');if(item.evidence_options?(d.action==='resolve'?!item.evidence_options.includes(d.evidence_id):(d.evidence_id!==''&&!item.evidence_options.includes(d.evidence_id))):item.source_id!==d.evidence_id)throw Error('Missing or changed evidence') }}
document.getElementById('export').addEventListener('click',()=>{try{const doc=header();doc.decisions=Object.values(saved.decisions).sort((a,b)=>a.item_id.localeCompare(b.item_id));validateDoc(doc);const blob=new Blob([JSON.stringify(doc,null,2)+'\n'],{type:'application/json'});const a=node('a');a.href=URL.createObjectURL(blob);a.download='guide-editorial-decisions.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);status.textContent='Decision file exported.'}catch(e){status.textContent=e.message}});
document.getElementById('import').addEventListener('change',async e=>{try{const file=e.target.files[0];if(!file)return;if(file.size>5_000_000)throw Error('Decision file is too large');const doc=strictJson(await file.text());validateDoc(doc);if(editor.value&&doc.editor&&editor.value!==doc.editor)throw Error('Editor label conflicts with current work');const merged={...saved.decisions};for(const d of doc.decisions){if(merged[d.item_id]&&JSON.stringify(merged[d.item_id])!==JSON.stringify(d))throw Error('Imported decision conflicts with current work');merged[d.item_id]=d}saved.decisions=merged;if(!editor.value)editor.value=doc.editor;persist();status.textContent='Imported and merged '+doc.decisions.length+' decisions.';render()}catch(err){status.textContent='Import rejected: '+err.message}finally{e.target.value=''}});
render();
</script></body></html>
