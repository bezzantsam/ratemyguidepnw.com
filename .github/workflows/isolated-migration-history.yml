name: Local migration transaction and history
on:
  pull_request:
    branches:
      - codex/beta-completion
permissions:
  contents: read
jobs:
  migration-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify candidate and fixture
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD 'HEAD^{tree}'
          printf '%s  %s\n' 74afb69db957037086c0e5ffddd2a8d312bed4ded3e446ba3f145284a351686d supabase/review-candidates/launch-combined.sql 209c5fe39125ef17096941dac3c814c9e57b2e0b0be4789c9f49dc0510f34b9a supabase/review-candidates/launch-migration-body.sql 91c90f5efa8598855fad1b92f0aafd21dcc54a9b009e2a4c14c3ba9eb71e272f tests/backend-auth-local/run-ci.sh 35e53e43a454d57ea0d1f24431a57bef216428b150076ec3eb8cc99b604ea62d tests/backend-auth-local/prepare.py 4ab6cf7f6cb34d5b41c3d121286439d1ebb595a610dbf34066c204b47108c786 tests/backend-auth-local/migration-history.py 769333a38e66d394b80fcd95a71bbc97130c1e3e6465322decb9d37eb44a3b5d supabase/review-candidates/emergency-disable-migration-body.sql | sha256sum -c -
          python3 tests/backend-launch/assemble-runner-migration.py | cmp - supabase/review-candidates/launch-migration-body.sql
          python3 tests/backend-launch/assemble-runner-rollback.py | cmp - supabase/review-candidates/emergency-disable-migration-body.sql
      - name: Exercise local migration rollback and history
        shell: bash
        run: RMG_FIXTURE_SCHEMA_ONLY=1 bash tests/backend-auth-local/run-ci.sh "$GITHUB_WORKSPACE/tests/backend-auth-local/migration-history.py"
