name: RateMyGuidePNW verified app build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-safe-chinook:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install website dependencies
        run: npm install --no-audit --no-fund
      - name: Verify public Chinook evidence and private data separation
        run: npm run test:intel
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-chinook-watch.txt
      - name: Install official Chinook source parser
        run: python -m pip install -r requirements-chinook-watch.txt
      - name: Test Chinook official-source and no-fabricated-zeros safeguards
        run: python -m unittest discover -s tests -p 'test_chinook_wdfw_watch.py' -v
      - name: Test historical NOAA tide source, clock-time and publication safeguards
        run: python -m unittest discover -s tests -p 'test_noaa_astoria_2026_watch.py' -v
      - name: Check source-backed Chinook methodology and accuracy disclosures
        run: node --test tests/methodology.test.mjs
      - name: TypeScript check
        run: npm run typecheck
      - name: Build Next.js production assets without private DB credentials
        run: npm run build
