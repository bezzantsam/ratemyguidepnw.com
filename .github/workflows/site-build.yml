name: RateMyGuidePNW verified app build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-safe-chinook:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install website dependencies
        run: npm install --no-audit --no-fund
      - name: Verify public Chinook evidence and private data separation
        run: npm run test:intel
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-chinook-watch.txt
      - name: Install official Chinook source parser
        run: python -m pip install -r requirements-chinook-watch.txt
      - name: Test Chinook official-source and no-fabricated-zeros safeguards
        run: python -m unittest discover -s tests -p 'test_chinook_wdfw_watch.py' -v
      - name: Test historical NOAA tide source, clock-time and publication safeguards
        run: python -m unittest discover -s tests -p 'test_noaa_astoria_2026_watch.py' -v
      - name: Check source-backed Chinook methodology and accuracy disclosures
        run: node --test tests/methodology.test.mjs
      - name: Verify guide profile provenance and honest review evidence labels
        run: node --test tests/guide-trust.test.mjs
      - name: Verify installable mobile shell and private-data offline policy
        run: npm run test:pwa
      - name: Verify browser-local saved captain shortlist
        run: npm run test:shortlist
      - name: Verify pending-only review composer
        run: npm run test:review
      - name: Verify Washington public profile URL stability
        run: npm run test:directory-ids
      - name: Verify evidence-backed guide discovery, aliases and search filters
        run: npm run test:discovery
      - name: Verify distinct OR/WA identities and imported-source provenance
        run: npm run test:identities
      - name: Validate captain-contributed fisheries, seasons and pending-only RLS proposal
        run: npm run test:captain-fisheries
      - name: Test captain fleet moderator diffs and dev-only inbox guard
        run: npm run test:moderation
      - name: TypeScript check
        run: npm run typecheck
      - name: Build Next.js production assets without private DB credentials
        run: npm run build
