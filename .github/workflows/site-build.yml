name: RateMyGuidePNW verified app build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-safe-chinook:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install website dependencies
        run: npm install --no-audit --no-fund
      - name: Verify public Chinook evidence and private data separation
        run: npm run test:intel
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-chinook-watch.txt
      - name: Install official Chinook source parser
        run: python -m pip install -r requirements-chinook-watch.txt
      - name: Test Chinook official-source and no-fabricated-zeros safeguards
        run: python -m unittest discover -s tests -p 'test_chinook_wdfw_watch.py' -v
      - name: Test historical NOAA tide source, clock-time and publication safeguards
        run: python -m unittest discover -s tests -p 'test_noaa_astoria_2026_watch.py' -v
      - name: Verify unpublished Batch 13 enrichment proposal
        run: |
          python -m unittest discover -s tests -p 'test_batch13_enrichment_proposal.py' -v
          python scripts/batch13_enrichment_proposal.py --check
          python -m unittest discover -s tests -p 'test_extended_enrichment_proposal.py' -v
          python scripts/extended_enrichment_proposal.py --check
      - name: Verify consolidated Batch 13 population handoff
        run: |
          python -m unittest discover -s tests -p 'test_batch13*.py' -v
          node --test tests/guide-batch13-next30*.test.mjs
          python scripts/batch13_consolidated.py --check
          python -m unittest discover -s tests -p 'test_editorial_review.py' -v
          python -m unittest discover -s tests -p 'test_editorial_release.py' -v
          python -m unittest discover -s tests -p 'test_editorial_visual_data.py' -v
          node --test tests/editorial-visual-adapter.test.mjs
      - name: Check source-backed Chinook methodology and accuracy disclosures
        run: node --test tests/methodology.test.mjs
      - name: Verify guide profile provenance and honest review evidence labels
        run: node --test tests/guide-trust.test.mjs
      - name: Verify MVP directory and Washington identity safety
        run: npm run test:mvp
      - name: TypeScript check
        run: npm run typecheck
      - name: Verify browser build isolation and process cleanup
        run: npm run test:isolation
      - name: Install Chromium for browser regression
        run: npx playwright-core install --with-deps chromium
      - name: Test offline editorial review export and import
        shell: bash
        run: |
          export BROWSER_EXECUTABLE="$(node --input-type=module -e "import {chromium} from 'playwright-core'; console.log(chromium.executablePath())")"
          node --test tests/editorial-review-browser.test.mjs
      - name: Build and smoke test ordinary production data in an isolated snapshot
        shell: bash
        run: |
          set -euo pipefail
          export BROWSER_EXECUTABLE="$(node --input-type=module -e "import {chromium} from 'playwright-core'; console.log(chromium.executablePath())")"
          export BROWSER_SCREENSHOT_DIR="$RUNNER_TEMP/ratemyguide-read-only-screenshots"
          node scripts/browser-isolation.mjs ordinary "$(git rev-parse 'HEAD^{tree}')"
      - name: Preserve read-only directory QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: read-only-directory-qa
          path: ${{ runner.temp }}/ratemyguide-read-only-screenshots/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Build and test synthetic discovery in a separate isolated snapshot
        shell: bash
        run: |
          set -euo pipefail
          export BROWSER_EXECUTABLE="$(node --input-type=module -e "import {chromium} from 'playwright-core'; console.log(chromium.executablePath())")"
          bash scripts/build-fixture-browser.sh "$(git rev-parse 'HEAD^{tree}')"
      - name: Exercise unapproved editorial visual rehearsal
        shell: bash
        run: |
          set -euo pipefail
          export BROWSER_EXECUTABLE="$(node --input-type=module -e "import {chromium} from 'playwright-core'; console.log(chromium.executablePath())")"
          node scripts/editorial-visual.mjs --test --screenshots "$RUNNER_TEMP/ratemyguide-visual-screenshots"
      - name: Preserve QA-only preview screenshots
        uses: actions/upload-artifact@v4
        with:
          name: unapproved-editorial-preview-qa
          path: ${{ runner.temp }}/ratemyguide-visual-screenshots/*.png
          if-no-files-found: error
          retention-days: 7
