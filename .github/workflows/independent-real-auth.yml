name: Independent isolated Auth and PostgREST QA
on:
  pull_request:
    branches:
      - codex/beta-completion
permissions:
  contents: read
jobs:
  independent-auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify candidate and independent assertions
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD 'HEAD^{tree}'
          printf '%s  %s\n' 74afb69db957037086c0e5ffddd2a8d312bed4ded3e446ba3f145284a351686d supabase/review-candidates/launch-combined.sql 948d8d2502a885c306d7880da8574766e6b9fa91de3fd9a3274583beb88ca82f tests/backend-auth-local/run-ci.sh 0244f7df1197187e26dd3049cb0ff09212b776b9b1a01d6987ca89e9d7843867 tests/backend-auth-local/prepare.py 736416ac96bfcc2d98aabb762888f8e6a1303dd23ef7abcff6ad74a187e2a26d tests/independent-qa/independent-auth-postgrest.py | sha256sum -c -
      - name: Exercise independently authored local customer and authorization paths
        shell: bash
        run: bash tests/backend-auth-local/run-ci.sh "$GITHUB_WORKSPACE/tests/independent-qa/independent-auth-postgrest.py"
