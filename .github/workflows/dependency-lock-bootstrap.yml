name: Generate review-only dependency lock candidate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  generate-lock:
    if: github.repository == 'bezzantsam/ratemyguidepnw.com' && github.event.pull_request.number == 117 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'coordinator/rmg-launch-prep'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Generate without install scripts and validate with a frozen install
        shell: bash
        env:
          CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test ! -f package-lock.json
          test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD"
          export OUT="$RUNNER_TEMP/rmg-dependency-candidate"
          mkdir "$OUT"
          cp package.json "$OUT/package.json"
          cd "$OUT"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          cp package-lock.json lock-before-ci.json
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          cmp lock-before-ci.json package-lock.json
          rm lock-before-ci.json
          node <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const cp=require('node:child_process');
          const sha=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          if(process.versions.node.split('.')[0]!=='22'||lock.lockfileVersion!==3) throw Error('Unexpected runtime or lock format');
          const dependencies=Object.fromEntries(Object.keys({...pkg.dependencies,...pkg.devDependencies}).sort().map(name=>[name,lock.packages['node_modules/'+name]?.version]));
          if(Object.values(dependencies).some(x=>!x)) throw Error('Missing direct dependency');
          const report={schema:'rmg-lock-generation/1',head:process.env.CANDIDATE_HEAD,node:process.version,npm:cp.execFileSync('npm',['--version'],{encoding:'utf8'}).trim(),package_sha256:sha('package.json'),lock_sha256:sha('package-lock.json'),package_count:Object.keys(lock.packages).length,dependencies,lifecycle_scripts_executed:false,clean_install_passed:true,application_build_tested:false};
          fs.writeFileSync('generation.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          NODE
          cd "$GITHUB_WORKSPACE"
          git archive --format=tar --output="$OUT/source.tar" HEAD -- . ':!.env*' ':!*.key' ':!*.pem' ':!*.p12' ':!*.pfx'
      - uses: actions/upload-artifact@v4
        with:
          name: rmg-lock-candidate-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/rmg-dependency-candidate/package.json
            ${{ runner.temp }}/rmg-dependency-candidate/package-lock.json
            ${{ runner.temp }}/rmg-dependency-candidate/generation.json
            ${{ runner.temp }}/rmg-dependency-candidate/source.tar
          if-no-files-found: error
          retention-days: 7
