name: Independent synthetic Storage HTTP QA
on:
  pull_request:
    branches:
      - codex/beta-completion
permissions:
  contents: read
jobs:
  storage-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: supabase/storage
          ref: c8f93e5164ba564fccd66596b318c5e8e2136604
          path: .storage-upstream
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://www.postgresql.org/media/keys/ACCC4CF8.asc -o "$RUNNER_TEMP/pgdg.asc"
          fingerprint="$(gpg --show-keys --with-colons "$RUNNER_TEMP/pgdg.asc" | awk -F: '$1=="fpr" {print $10;exit}')"
          test "$fingerprint" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          sudo install -m 644 "$RUNNER_TEMP/pgdg.asc" /usr/share/keyrings/rmg-pgdg.asc
          echo 'deb [signed-by=/usr/share/keyrings/rmg-pgdg.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/rmg-pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-17
      - name: Build pinned upstream Storage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .storage-upstream rev-parse HEAD)" = c8f93e5164ba564fccd66596b318c5e8e2136604
          cd .storage-upstream
          npm ci --no-audit --no-fund
          npm run build
      - name: Exercise 05 synthetic Storage HTTP assertions
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          git rev-parse HEAD 'HEAD^{tree}'
          sha256sum supabase/review-candidates/launch-combined.sql tests/independent-qa/storage-http/run.py tests/independent-qa/storage-http/storage-fixture.sql tests/independent-qa/storage-http/storage-policies.sql
          printf '%s  %s\n' ad1a934fc4f6bb958fdb44a156d1367e62662e2d99a0890b70b0bfb859bcd9e8 tests/independent-qa/storage-http/run.py fd06a8e943b8470a05495be5e79f45b9e7a66a37b47e65b17aae2a10ff40068c tests/independent-qa/storage-http/storage-fixture.sql 3865a5858596e84ff699b2c87e50f4ee82fee66bd8332a1f4b32a96760fe9c1e tests/independent-qa/storage-http/storage-policies.sql | sha256sum -c -
          printf '%s  %s\n' 6144fba197324a811a8e856733ad27819b3f2bafb6b807d09d91abf8c93676bc tests/backend-launch/reconstruct.py 7bab10cbbd0b9246fbd9a19591b8fa21f5afc0de2d9f0e0ad47cfd018ddc9ec4 tests/backend-launch/fixture-catalog.json 7fdc9f18d42455679da639c370d11b240dfd987b762097935e0d29c8e7094cdb tests/backend-launch/fixtures.sql | sha256sum -c -
          python3 tests/independent-qa/storage-http/run.py --storage-source "$GITHUB_WORKSPACE/.storage-upstream" --candidate-root "$GITHUB_WORKSPACE" --fixture-dir "$GITHUB_WORKSPACE/tests/independent-qa/storage-http" --results "$RUNNER_TEMP/storage-http-results.json"
      - name: Preserve sanitized result
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-storage-http-results
          path: ${{ runner.temp }}/storage-http-results.json
          if-no-files-found: error
          retention-days: 7
